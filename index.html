<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社康健康经营看板</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" integrity="sha384-pPi0zxBAoDu6+JXW/C68UZLvBUUtU+7zonhif43rqj7pxsGyqyqzcian2Rj37Rss" crossorigin="anonymous"></script>
<style>:root{
  --bg:#F5F4EF;
  --panel:#FFFFFF;
  --line:#E7E5DD;
  --line2:#F0EEE8;
  --ink:#1C2B25;
  --ink2:#5C6B64;
  --ink3:#98A29C;
  --brand:#0F6B57;
  --brand2:#2F8A73;
  --brand3:#E9F2EE;
  --st1:#7FB8A8;   /* 触达 */
  --st2:#3D9A86;   /* 体验 */
  --st3:#0F5C4C;   /* 订阅 */
  --sub1:#3D9A86;  /* 门诊 */
  --sub2:#4A7FB5;  /* 社区活动 */
  --sub3:#C9892B;  /* 企业活动 */
  --sub4:#8A9A93;  /* 自行拓展 */
  --ok:#2E8B57; --warn:#C9892B; --bad:#B4553F;
  --shadow:0 1px 2px rgba(28,43,37,.04),0 6px 18px rgba(28,43,37,.05);
  --shadow-hover:0 2px 4px rgba(28,43,37,.05),0 12px 28px rgba(28,43,37,.09);
  --r:13px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background-image:
  linear-gradient(rgba(28,43,37,.022) 1px,transparent 1px),
  linear-gradient(90deg,rgba(28,43,37,.022) 1px,transparent 1px),
  radial-gradient(1100px 500px at 10% -6%,rgba(63,154,134,.11),transparent 62%),
  radial-gradient(920px 460px at 88% -10%,rgba(201,137,43,.07),transparent 60%),
  radial-gradient(760px 400px at 98% 16%,rgba(74,127,181,.06),transparent 55%);
  background-color:var(--bg);
  background-size:38px 38px,38px 38px,100% 100%,100% 100%,100% 100%;
  background-attachment:fixed;
  color:var(--ink);font-family:"PingFang SC","Noto Sans SC",-apple-system,"Microsoft YaHei",sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{padding-bottom:64px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.serif{font-weight:700;letter-spacing:.01em}
a{color:inherit;text-decoration:none}
.wrap{max-width:1560px;margin:0 auto;padding:0 28px}
/* ===== 顶栏 ===== */
.topbar{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar .wrap{display:flex;align-items:center;gap:20px;height:60px}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer}
.brand .logo{width:31px;height:31px;border-radius:9px;background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 3px 8px rgba(15,107,87,.25)}
.brand h1{font-size:16.5px;font-weight:700;letter-spacing:.01em}
.brand .logo svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.crumb{font-size:12.5px;color:var(--ink2);margin-left:8px}
.crumb .sep{margin:0 8px;color:var(--ink3)}
.crumb .cur{color:var(--ink);font-weight:600}
.nav{display:flex;gap:2px;background:#F0EFEA;border:1px solid var(--line);border-radius:10px;padding:3px;margin-left:8px}
.nav a{font-size:13px;padding:5px 16px;border-radius:8px;color:var(--ink2);cursor:pointer;transition:all .18s}
.nav a:hover{color:var(--ink);background:rgba(255,255,255,.5)}
.nav a.on{background:#fff;color:var(--brand);font-weight:600;box-shadow:0 1px 3px rgba(28,43,37,.10)}
.topbar .meta{margin-left:auto;font-size:12px;color:var(--ink3);text-align:right;white-space:nowrap}
.topbar .meta .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px;box-shadow:0 0 0 3px rgba(46,139,87,.15)}
/* ===== 页面头 ===== */
.pagehead{padding:20px 0 4px}
.pagehead h2{font-size:23px;font-weight:800;letter-spacing:.01em;display:flex;align-items:baseline;gap:14px}
.pagehead h2 .en{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.pagehead .sub{margin-top:7px;color:var(--ink2);font-size:13px;max-width:820px}
.note{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--ink3);background:var(--brand3);border:1px solid #DCEAE3;border-radius:7px;padding:4px 11px}
.note svg{width:13px;height:13px;stroke:var(--ink3);flex:none}
/* ===== 区块 ===== */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:13px}
.sec-h h3{font-size:15.5px;font-weight:700}
.sec-h .hint{font-size:12px;color:var(--ink3)}
.sec-h .more{margin-left:auto;font-size:12px;color:var(--brand);font-weight:600;cursor:pointer}
/* ===== 漏斗层级卡 ===== */
.funnel{display:flex;align-items:stretch;gap:0}
.fstage{flex:1 1 0;min-width:0;border:1px solid rgba(231,229,221,.92);border-radius:var(--r);padding:20px 18px 17px;cursor:pointer;position:relative;transition:box-shadow .25s,border-color .25s,transform .25s;background:rgba(255,255,255,.78);backdrop-filter:blur(14px) saturate(1.15);-webkit-backdrop-filter:blur(14px) saturate(1.15);box-shadow:0 1px 2px rgba(28,43,37,.05),0 10px 30px rgba(28,43,37,.07),inset 0 1px 0 rgba(255,255,255,.75)}
.fstage:hover{border-color:rgba(47,138,115,.5);box-shadow:0 4px 8px rgba(28,43,37,.06),0 18px 44px rgba(15,107,87,.14),inset 0 1px 0 rgba(255,255,255,.8);transform:translateY(-3px)}
.fstage .bar{position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:4px}
.fstage .top{display:flex;align-items:center;gap:8px}
.fstage .top .nm{font-size:14px;font-weight:700}
.fstage .top .tag{font-size:11px;color:var(--ink3);background:var(--line2);border-radius:5px;padding:1px 7px}
.fstage .cnt{font-size:42px;font-weight:800;line-height:1.08;margin-top:12px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;background:linear-gradient(180deg,#263B33 0%,#0F6B57 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.fstage .cnt small{font-size:14px;font-weight:600;color:var(--ink3);margin-left:6px;letter-spacing:0}
.fstage .add{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--ink2)}
.fstage .add b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.fstage .add .lbl{color:var(--ink3);margin-right:3px}
.fstage .goal{margin-top:15px;padding-top:13px;border-top:1px dashed var(--line)}
.fstage .goal .gline{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:7px}
.fstage .goal .gline b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.track{height:7px;background:var(--line2);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#4FB09A,var(--brand));box-shadow:0 0 10px rgba(15,107,87,.35)}
.fstage .go{padding-top:7px;font-size:12px;color:var(--ink3)}
.fstage .go .lvl{font-weight:700;font-variant-numeric:tabular-nums}
.arr{display:flex;align-items:center;justify-content:center;color:var(--ink3);flex:none;padding:0 8px}
.arr svg{width:20px;height:20px;stroke:var(--ink3);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* ===== 社康卡 ===== */
.skgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px}
.skcard{border:1px solid rgba(231,229,221,.92);border-radius:var(--r);padding:17px;cursor:pointer;transition:box-shadow .25s,border-color .25s,transform .25s;background:rgba(255,255,255,.78);backdrop-filter:blur(14px) saturate(1.15);-webkit-backdrop-filter:blur(14px) saturate(1.15);box-shadow:0 1px 2px rgba(28,43,37,.05),0 10px 30px rgba(28,43,37,.07),inset 0 1px 0 rgba(255,255,255,.75)}
.skcard:hover{border-color:rgba(47,138,115,.5);box-shadow:0 4px 8px rgba(28,43,37,.06),0 18px 44px rgba(15,107,87,.14),inset 0 1px 0 rgba(255,255,255,.8);transform:translateY(-3px)}
.skcard .nm{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.skcard .nm .dot{width:8px;height:8px;border-radius:50%;background:var(--brand2);box-shadow:0 0 0 3px rgba(47,138,115,.15)}
.skcard .vals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
.skcard .v{background:var(--bg);border-radius:9px;padding:9px 6px;text-align:center}
.skcard .v .n{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;background:linear-gradient(180deg,#263B33 0%,#0F6B57 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.skcard .v .l{font-size:11px;color:var(--ink3);margin-top:2px}
.skcard .goal{margin-top:13px;padding-top:11px;border-top:1px dashed var(--line);font-size:11px;color:var(--ink3)}
.skcard .goal .t{margin-bottom:4px}
.skcard .goal .lvl{float:right;font-weight:700;font-variant-numeric:tabular-nums}
/* ===== 网格布局 ===== */
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
.filterbar .fb-sep{width:1px;height:20px;background:var(--line);margin:0 8px}
.tbl .src{display:inline-block;margin-left:4px;font-size:10px;color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:0 4px;line-height:14px;vertical-align:1px;white-space:nowrap;cursor:help}
.muted{color:var(--ink3)}
.subcard.click{cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}
.subcard.click:hover{transform:translateY(-3px);border-color:rgba(15,107,87,.45);box-shadow:0 4px 8px rgba(28,43,37,.06),0 14px 34px rgba(15,107,87,.13),inset 0 1px 0 rgba(255,255,255,.8)}
.subcard .p{font-size:11px;color:var(--brand);margin-top:6px;font-weight:600}
.srcchip{display:inline-flex;align-items:center;gap:8px;margin:14px 0 0;padding:7px 12px;background:var(--brand3);border:1px solid #DCEAE3;border-radius:20px;font-size:12px;color:var(--ink)}
.srcchip a{color:var(--brand);cursor:pointer;font-weight:700}
/* 漏斗分析区（左图右信息） */
.funnel-wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;align-items:stretch}
.finfo{display:flex;flex-direction:column;gap:12px}
.finfo .frow{border:1px solid rgba(231,229,221,.92);border-radius:12px;padding:15px 17px;cursor:pointer;transition:box-shadow .25s,border-color .25s,transform .25s;background:rgba(255,255,255,.78);backdrop-filter:blur(14px) saturate(1.15);-webkit-backdrop-filter:blur(14px) saturate(1.15);box-shadow:0 1px 2px rgba(28,43,37,.05),0 10px 30px rgba(28,43,37,.07),inset 0 1px 0 rgba(255,255,255,.75)}
.finfo .frow:hover{border-color:rgba(47,138,115,.5);box-shadow:0 4px 8px rgba(28,43,37,.06),0 14px 34px rgba(15,107,87,.13),inset 0 1px 0 rgba(255,255,255,.8);transform:translateY(-2px)}
.finfo .frow .h{display:flex;align-items:center;justify-content:space-between}
.finfo .frow .h .nm{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.finfo .frow .h .nm i{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.finfo .frow .h .cnt{font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;background:linear-gradient(180deg,#263B33 0%,#0F6B57 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.finfo .frow .h .cnt small{font-size:12px;color:var(--ink3);font-weight:600;margin-left:4px}
.finfo .frow .meta{display:flex;gap:18px;margin-top:9px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.finfo .frow .meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.finfo .frow .meta .kw{color:var(--ink2)}
.finfo .frow .meta .kw b{font-size:16px;font-weight:800;color:var(--brand);margin-left:2px}
.finfo .frow .meta .dim{color:var(--ink3)}
.finfo .frow .meta .dim b{color:var(--ink2);font-weight:600}
.finfo .frow .goal{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.finfo .frow .goal .glab b{color:var(--ink);font-weight:700}
.finfo .frow .goal .gact b{color:var(--ink);font-weight:700}
.finfo .frow .goal .gsep{color:var(--line)}
.finfo .frow .goal .glvl{white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.finfo .frow .goal .track{flex:1;height:6px}
.finfo .frow .agemsg{margin-top:8px;font-size:11px;color:var(--warn)}
/* 全局年龄筛选 */
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 0;border:1px solid rgba(231,229,221,.92);border-radius:12px;padding:11px 14px;background:rgba(255,255,255,.78);backdrop-filter:blur(14px) saturate(1.15);-webkit-backdrop-filter:blur(14px) saturate(1.15);box-shadow:0 1px 2px rgba(28,43,37,.05),0 10px 30px rgba(28,43,37,.07),inset 0 1px 0 rgba(255,255,255,.75)}
.filterbar .fb-label{font-size:12px;color:var(--ink3);font-weight:600;margin-right:2px}
.filterbar .fb-note{margin-left:auto;font-size:11px;color:var(--ink3)}
.filterbar .fbtcust{display:inline-flex;align-items:center;gap:6px;margin:8px 0 2px;padding:8px 12px;background:var(--brand3);border:1px solid #DCEAE3;border-radius:9px;flex-wrap:wrap;flex-basis:100%}
.filterbar .fbtcust input[type=date]{font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);outline:none}
.filterbar .fbtcust input[type=date]:focus{border-color:var(--brand2)}
.filterbar .fbtcust .btn.mini{padding:3px 12px;font-size:12px}
.filterbar .fb-clear{margin-left:10px;color:var(--brand);cursor:pointer;font-size:12px;font-weight:600;text-decoration:none}
.note.mini{font-size:11px;padding:3px 9px;background:var(--brand3)}
.panel{border:1px solid rgba(231,229,221,.92);border-radius:var(--r);padding:19px;background:rgba(255,255,255,.78);backdrop-filter:blur(14px) saturate(1.15);-webkit-backdrop-filter:blur(14px) saturate(1.15);box-shadow:0 1px 2px rgba(28,43,37,.05),0 10px 30px rgba(28,43,37,.07),inset 0 1px 0 rgba(255,255,255,.75)}
.panel h4{font-size:14px;font-weight:700;margin-bottom:4px}
.panel .phint{font-size:12px;color:var(--ink3);margin-bottom:12px}
.chart{width:100%;min-height:300px}
/* ===== KPI 组 ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.kpi{border:1px solid rgba(231,229,221,.92);border-radius:var(--r);padding:17px 19px;background:rgba(255,255,255,.78);backdrop-filter:blur(14px) saturate(1.15);-webkit-backdrop-filter:blur(14px) saturate(1.15);box-shadow:0 1px 2px rgba(28,43,37,.05),0 10px 30px rgba(28,43,37,.07),inset 0 1px 0 rgba(255,255,255,.75)}
.kpi .l{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.kpi .l .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.kpi .n{font-size:34px;font-weight:800;margin-top:7px;font-variant-numeric:tabular-nums;line-height:1.08;letter-spacing:-.02em;background:linear-gradient(180deg,#263B33 0%,#0F6B57 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi .n small{font-size:13px;color:var(--ink2);font-weight:600;margin-left:6px}
/* ===== 目标对标 ===== */
.goals{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.goalcard{border:1px solid rgba(231,229,221,.92);border-radius:var(--r);padding:17px 19px;background:rgba(255,255,255,.78);backdrop-filter:blur(14px) saturate(1.15);-webkit-backdrop-filter:blur(14px) saturate(1.15);box-shadow:0 1px 2px rgba(28,43,37,.05),0 10px 30px rgba(28,43,37,.07),inset 0 1px 0 rgba(255,255,255,.75)}
.goalcard .h{display:flex;justify-content:space-between;align-items:baseline}
.goalcard .h .l{font-size:13px;font-weight:700}
.goalcard .h .val{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.goalcard .h .val b{color:var(--ink);font-size:15px;font-weight:800}
.goalcard .track{margin-top:13px;height:8px}
.goalcard .rate{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:var(--ink2)}
.goalcard .rate b{font-size:16px;font-variant-numeric:tabular-nums}
.rate-ok{color:var(--ok)}.rate-warn{color:var(--warn)}.rate-bad{color:var(--bad)}
/* ===== 表格 ===== */
.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-weight:600;color:var(--ink2);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg)}
table.tbl td{padding:12px 14px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.tbl tbody tr:hover{background:var(--brand3)}
table.tbl td.numc,table.tbl th.numc{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11px;padding:1px 9px;border-radius:20px;background:var(--line2);color:var(--ink2)}
.chip.b{background:var(--brand3);color:var(--brand)}
.chip.o{background:#F7F0E0;color:#9A6B17}
.chip.bad{background:#F7E9E4;color:#A44A38}
.chip.done{background:var(--brand3);color:var(--ok)}
.chip.run{background:#EAF1F7;color:#2E6D9E}
.chip.plan{background:var(--line2);color:var(--ink3)}
/* ===== 筛选 ===== */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fbtn{font-size:13px;padding:6px 15px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);cursor:pointer;transition:all .18s}
.fbtn.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(15,107,87,.25)}
.fbtn:hover{border-color:var(--brand2);color:var(--brand)}
/* ===== 心跳线 ===== */
.hrt{margin:14px 0 4px;border-bottom:1px solid var(--line)}
/* ===== 空态 ===== */
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--ink3);background:#FBFAF7}
.empty .t{font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:4px}
/* ===== 子渠道 ===== */
.subgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.subcard{border:1px solid rgba(231,229,221,.92);border-radius:11px;padding:13px 15px;background:rgba(255,255,255,.78);backdrop-filter:blur(14px) saturate(1.15);-webkit-backdrop-filter:blur(14px) saturate(1.15);box-shadow:0 1px 2px rgba(28,43,37,.05),0 10px 30px rgba(28,43,37,.07),inset 0 1px 0 rgba(255,255,255,.75)}
.subcard .nm{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.subcard .nm i{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.subcard .n{font-size:26px;font-weight:800;margin-top:7px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;background:linear-gradient(180deg,#263B33 0%,#0F6B57 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.subcard .p{font-size:12px;color:var(--ink3);margin-top:2px}
/* ===== 洞察 ===== */
.insight{background:var(--brand3);border:1px solid #DCEAE3;border-left:3px solid var(--brand);border-radius:11px;padding:15px 17px;font-size:13px;color:var(--ink)}
.insight b{color:var(--brand)}
.insight .lbl{font-size:11px;color:var(--brand);font-weight:700;letter-spacing:.08em;margin-bottom:4px}
/* ===== 返回 ===== */
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);cursor:pointer;margin-bottom:4px}
.back svg{width:15px;height:15px;stroke:var(--ink2)}
.back:hover{color:var(--brand)}
.astats .ash h4{font-size:13px;margin:0 0 6px}
.astats .arow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px}
.astats .arow span{color:var(--ink2)}

.ash{font-size:12px;font-weight:700;color:var(--ink)}
/* ===== 年龄分布 ===== */
.adist{margin-top:10px;padding:13px 15px;background:var(--bg);border-radius:9px}
.adhead{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:4px}
.adrow{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12px}
.al{width:56px;color:var(--ink2);flex:none}
.atrack{flex:1;height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.atrack i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));border-radius:4px}
.an{width:104px;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums;flex:none}

.srow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.srow:last-child{border-bottom:none}
.sl{width:150px;font-size:12px;color:var(--ink2);font-weight:600;flex:none}
.inp{flex:1;min-width:200px;max-width:440px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#FBFAF7;color:var(--ink);outline:none;transition:border-color .15s}

.btn:hover{border-color:var(--brand2);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand2);color:#fff}
.btn.danger{color:#C0392B;border-color:#E8C9C4}
.btn.danger:hover{background:#FBEFED}
.btn:disabled{opacity:.5;cursor:not-allowed}
.sinfo{flex:1;font-size:13px;color:var(--ink2);min-width:200px}
.sinfo b{color:var(--ink)}
.smsg{margin-top:10px;font-size:12px;color:var(--brand)}
.smsg.warn{color:#B9770E}
.smsg.note2{color:var(--ink3)}
.sstat{margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:8px;font-size:12px;color:var(--ink2)}
.stab{width:100%;border-collapse:collapse;font-size:13px}
.stab th,.stab td{padding:10px 12px;border-bottom:1px solid var(--line2);text-align:left}
.stab th{color:var(--ink3);font-weight:600;font-size:12px}
.stab td b{color:var(--ink)}

  .kpis{grid-template-columns:1fr 1fr}

  .pagehead h2{font-size:20px}
}

  .wrap{padding:0 14px}
}

  const txt = await res.text(); let j;

function rangeBounds(){
  if(curRangeMode==='all') return [null,null];
  if(curRangeMode==='today') return [M.refDate,M.refDate];
  if(curRangeMode==='week') return [M.weekStart,M.weekEnd];
  if(curRangeMode==='month') return [M.monthStart,M.monthEnd];

function quarterRange(d){

}
function inRange(t){
  if(curRangeMode==='all' || !t) return curRangeMode==='all';

function bucketLabels(edges){

/* ===== 明细层统计（实时） ===== */
function layerRows(layer, sk){
  let rows = (layer==='触达') ? DATA.reg : (layer==='体验') ? DATA.exp : DATA.sub;
  if(sk) rows = rows.filter(r=>r[0]===sk);
  if(curAge!=='全部'){
    if(layer==='触达') rows = rows.filter(r=>userBucketFor('触达',r)===curAge);
    else if(layer==='体验' && ageSupported('体验')) rows = rows.filter(r=>userBucketFor('体验',r)===curAge);
  }
  if(curCat!=='全部' && layerHasCat(layer)) rows = rows.filter(r=>catOf(r)===curCat);
  if(curSrc!=='全部' && layer==='触达'){
    if(curSrc==='自行拓展') rows = rows.filter(r=>!['医生介绍','社区活动','企业活动'].includes(r[2]));
    else rows = rows.filter(r=>r[2]===curSrc);
  }
  return rows;
}
function timeField(layer,r){
  if(layer==='触达') return r[1];      // 记录时间
  if(layer==='体验') return r[5];      // 佩戴体验开始
  return r[0];                         // 订阅开始
}
function periodStats(layer, sk){
  const rows = layerRows(layer,sk);
  let today=0,week=0,month=0,inrange=0;
  rows.forEach(r=>{
    const t=timeField(layer,r);
    if(!t) return;
    if(inRange(t)) inrange++;
    if(t===M.refDate) today++;
    if(weekOf(t)) week++;
    if(monthOf(t)) month++;
  });
  const ranged = curRangeMode!=='all';
  return {today,week,month,total:(ranged?inrange:rows.length), ranged, inrange};
}

function expActive(sk){
  let rows = DATA.exp.filter(r=>(!sk||r[0]===sk) && r[5] && !r[6]);
  if(curAge!=='全部' && ageSupported('体验')) rows = rows.filter(r=>userBucketFor('体验',r)===curAge);
  if(curCat!=='全部') rows = rows.filter(r=>catOf(r)===curCat);
  return rows.length;
}
function layerAgeRows(layer, sk){
  let rows = (layer==='触达') ? DATA.reg : (layer==='体验') ? DATA.exp : [];
  if(sk) rows = rows.filter(r=>r[0]===sk);
  if(curCat!=='全部' && layerHasCat(layer)) rows = rows.filter(r=>catOf(r)===curCat);
  if(curSrc!=='全部' && layer==='触达'){
    if(curSrc==='自行拓展') rows = rows.filter(r=>!['医生介绍','社区活动','企业活动'].includes(r[2]));
    else rows = rows.filter(r=>r[2]===curSrc);
  }
  return rows;
}
function ageDistStats(layer, sk){
  const rows = layerAgeRows(layer, sk);
  const buckets = {}; ageOptions().forEach(b=>buckets[b]=0);
  const ages=[];
  rows.forEach(r=>{
    const ua = userAge(layer, r);
    if(ua.age==null) return;
    ages.push(ua.age);
    const bk = ageBucket(ua.age);
    if(buckets[bk]!=null) buckets[bk]++;
  });
  const known=ages.length;
  ages.sort((a,b)=>a-b);
  const avg = known? Math.round(ages.reduce((a,b)=>a+b,0)/known*10)/10 : null;
  const med = known? (known%2? ages[(known-1)/2] : Math.round((ages[known/2-1]+ages[known/2])/2)) : null;
  return {buckets, known, total:rows.length, avg, med, min:known?ages[0]:null, max:known?ages[known-1]:null};
}

/* ===== 目标（目标完成汇总表口径） ===== */
function weeklyRow(dim,week,stage){
  const hit = DATA.weekly.find(w=>w[0]===dim && w[1]===week && w[2]===stage);
  return hit?{target:hit[3],actual:hit[4]}:{target:0,actual:0};
}
function monthGoal(dim,stage){
  let t=0,a=0;
  DATA.weekly.forEach(w=>{
    if(w[0]===dim && w[2]===stage && w[1].indexOf(M.month)===0){ t+=w[3]; a+=w[4]; }
  });
  return {target:t,actual:a};
}
function mtMonth(name,month){ // 目标管理表月度目标（参考）
  const row = DATA.mt.find(m=>m[0]===name);
  if(!row) return null;
  const idx = {8:1,9:2,10:3,11:4}[parseInt(month)];
  return row[idx];
}

let navStack=[];
function go(h){ const cur=location.hash||'#/overview'; if(navStack[navStack.length-1]!==cur) navStack.push(cur); location.hash=h; }
function goBack(){ if(navStack.length){ location.hash=navStack.pop(); } else { location.hash='#/overview'; } }
function route(){
  const h = location.hash || '#/overview';
  setNav(h);
  let m;
  if(h==='#/settings') return renderSettings();
  if(h==='#/overview') return renderOverview();
  if((m=h.match(/^#\/layer\/([^/]+)\/([^/]+)$/))) return renderLayer(decodeURIComponent(m[1]), decodeURIComponent(m[2]));
  if((m=h.match(/^#\/layer\/([^/]+)$/))) return renderLayer(decodeURIComponent(m[1]), null);
  if((m=h.match(/^#\/sk\/([^/]+)$/))) return renderChannel(decodeURIComponent(m[1]));
  return renderOverview();
}
function setNav(h){
  let dec='';
  try{ dec=decodeURIComponent(h); }catch(e){ dec=h; }
  $$('#nav a').forEach(a=>{
    const dh=a.getAttribute('data-h');
    let on=false;
    if(dh==='overview') on = (h==='#/overview' || dec.indexOf('#/sk/')===0);
    else if(dh==='settings') on = dec.indexOf('#/settings')===0;
    else on = dec.indexOf('#/layer/'+dh)===0;
    a.classList.toggle('on',on);
  });
}

/* ===== 子渠道统计 ===== */
function subChannels(layer, sk){
  const rows = layerRows(layer,sk).filter(r=>inRange(timeField(layer,r)));
  const base = SUB_DEFS.map(d=>({k:d.k,c:d.c,n:0}));
  if(layer==='触达'){
    rows.forEach(r=>{
      const s=r[2];
      if(s==='医生介绍') base[0].n++;
      else if(s==='社区活动') base[1].n++;
      else if(s==='企业活动') base[2].n++;
      else base[3].n++;
    });
  } else if(layer==='体验'){
    // 门诊=来源活动为空
    rows.forEach(r=>{ if(!r[8]) base[0].n++; else base[1].n++; });
  } else {
    // 订阅按服务类型，暂无数据
  }
  return base;
}

    rows = SK.map(s=>{
      const p=periodStats('订阅',s), g=monthGoal(s,'订阅'), r=pct(g.actual,g.target);
      return '<tr style="cursor:pointer" onclick="go(\'#/layer/'+encodeURIComponent(layer)+'/'+encodeURIComponent(s)+'\')"><td>'+s+'</td><td class="numc">'+fmt(p.total)+'</td><td class="numc">'+fmt(g.target)+'</td><td class="numc"><b class="'+rateCls(r)+'">'+(r==null?'—':r+'%')+'</b></td></tr>';
    });
  }
  return '<table class="tbl"><thead>'+head+'</thead><tbody>'+rows.join('')+'</tbody></table>';
}

/* ===== 明细表 ===== */
function layerTable(layer, sk){
  if(layer==='触达'){
    const rows=DATA.reg.filter(r=>(!sk||r[0]===sk) && (curSrc==='全部'|| (curSrc==='自行拓展'? !['医生介绍','社区活动','企业活动'].includes(r[2]) : r[2]===curSrc)) && inRange(r[1])).slice().reverse();
    const srcChip=s=> s==='医生介绍'?'<span class="chip b">门诊</span>':s==='社区活动'?'<span class="chip o">社区</span>':s==='企业活动'?'<span class="chip">企业</span>':'<span class="chip">自行拓展</span>';
    let h='<tr><th>登记时间</th><th>社康</th><th>来源</th><th>性别</th><th>年龄</th></tr>';
    let b=rows.map(r=>{
      const ua=userAge('触达',r);
      const ageTxt = ua.age!=null ? ua.age+'岁<span class="src" title="登记表年龄段 '+esc(ua.raw||'')+'">登记</span>' : '<span class="muted">—</span>';
      return '<tr><td>'+esc(r[1])+'</td><td>'+esc(r[0])+'</td><td>'+srcChip(r[2])+'</td><td>'+esc(r[3])+'</td><td>'+ageTxt+'</td></tr>';
    }).join('');
    return '<table class="tbl"><thead>'+h+'</thead><tbody>'+(b||'<tr><td colspan="5">暂无数据</td></tr>')+'</tbody></table>';
  }
  if(layer==='体验'){
    const rows=DATA.exp.filter(r=>(!sk||r[0]===sk) && inRange(r[5])).slice().reverse();
    const devChip=d=> d==='押金'?'<span class="chip b">押金</span>':d==='自备'?'<span class="chip">自备</span>':d==='购买'?'<span class="chip o">购买</span>':'—';
    let h='<tr><th>用户</th><th>社康</th><th>分类</th><th>年龄</th><th>设备</th><th>体验产品</th><th>佩戴开始</th><th>佩戴结束</th><th>状态</th><th>退订原因</th></tr>';
    let b=rows.map(r=>{
      const st = r[6] ? '<span class="chip done">已结束</span>' : (r[5]?'<span class="chip run">体验中</span>':'<span class="chip plan">未开始</span>');
      const ua=userAge('体验',r);
      const ageTxt = ua.age!=null ? ua.age+'岁<span class="src" title="接口同步精确年龄">接口</span>' : '<span class="muted">—</span>';
      return '<tr><td>'+esc(r[1])+'</td><td>'+esc(r[0])+'</td><td>'+esc(r[2])+'</td><td>'+ageTxt+'</td><td>'+devChip(r[4])+'</td><td>'+esc(r[3]||'—')+'</td><td>'+esc(r[5]||'—')+'</td><td>'+esc(r[6]||'—')+'</td><td>'+st+'</td><td>'+esc(r[7]||'—')+'</td></tr>';
    }).join('');
    return '<table class="tbl"><thead>'+h+'</thead><tbody>'+(b||'<tr><td colspan="9">暂无数据</td></tr>')+'</tbody></table>';
  }
  let h='<tr><th>社康</th><th>订阅产品</th><th>金额</th><th>开始</th><th>结束</th><th>续订</th><th>退订原因</th></tr>';
  return '<table class="tbl"><thead>'+h+'</thead><tbody><tr><td colspan="7" style="text-align:center;color:var(--ink3)">暂无订阅数据</td></tr></tbody></table>';
}

/* ============ 视图：渠道详情 ============ */
function renderChannel(sk){
  crumbHTML([sk+' · 渠道详情']);
  curSrc='全部';
  const t=periodStats('触达',sk), e=periodStats('体验',sk), s=periodStats('订阅',sk);
  const acts = DATA.act.filter(a=>a[0]===sk);
  const subsT = subChannels('触达',sk), subsE = subChannels('体验',sk);

  let html='';
  html += '<div class="pagehead"><a class="back" onclick="goBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>返回总览</a>';
  html += '<h2 class="serif">'+sk+' <span class="en">CHANNEL</span></h2>';
  html += '<div class="sub">渠道漏斗：触达 '+fmt(t.total)+' → 体验 '+fmt(e.total)+' → 订阅 '+fmt(s.total)+' · 下方为该社康子渠道与活动明细</div></div>';
  html += ageFilterHTML();

  /* 漏斗三数 */
  html += '<div class="sec"><div class="kpis">';
  const rows=[['触达',t,'#7FB8A8'],['体验',e,'#3D9A86'],['订阅',s,'#0F5C4C']];
  const monthNum = parseInt(DATA.meta.month);
  rows.forEach(r=>{
    const st=r[0], ps=r[1], c=r[2], g=monthGoal(sk,st);
    let goalLabel='本月目标', goalVal=g.target;
    if(st==='体验'){ const mv=mtMonth(sk+'-体验-月度', monthNum); if(mv!=null){ goalLabel='新增体验目标'; goalVal=mv; } }
    const rate = goalVal>0 ? Math.round(g.actual/goalVal*100) : null;
    html += '<div class="kpi" onclick="go(\'#/layer/'+encodeURIComponent(st)+'/'+encodeURIComponent(sk)+'\')" style="cursor:pointer">';
    html += '<div class="l"><span class="dot" style="background:'+c+'"></span>'+st+' · 累计 <b>'+fmt(ps.total)+'</b><span style="margin-left:auto;font-size:11px">点击查看</span></div>';
    html += '<div class="n num">'+fmt(ps.month)+'<small>本月新增</small></div>';
    html += '<div class="go">'+goalLabel+' <b class="num">'+fmt(goalVal)+'</b> · 完成 <b class="num '+rateCls(rate)+'">'+fmt(g.actual)+'</b> · <span class="lvl '+rateCls(rate)+'">'+(rate==null?'—':rate+'%')+'</span></div>';
    html += '</div>';
  });
  html += '</div></div>';

  /* 子渠道 */
  html += '<div class="sec"><div class="grid2">';
  html += '<div class="panel"><h4>触达来源构成</h4><div class="phint">门诊=医生介绍，社区/企业/自行拓展按登记来源</div><div class="subgrid" style="grid-template-columns:repeat(2,1fr)">';
  const srcVals=['医生介绍','社区活动','企业活动','自行拓展'];
  subsT.forEach((sb,i)=>{
    const sv=srcVals[i];
    html += '<div class="subcard'+(sb.n?' click':'')+'"'+(sb.n?' onclick="drillSrc(\''+sk+'\',\''+sv+'\')"':'')+'><div class="nm"><i style="background:'+sb.c+'"></i>'+sb.k+'</div><div class="n num">'+fmt(sb.n)+'</div>'+(sb.n?'<div class="p">点击查看明细</div>':'')+'</div>';
  });
  html += '</div></div>';
  html += '<div class="panel"><h4>体验构成</h4><div class="phint">门诊=来源活动为空</div><div class="subgrid" style="grid-template-columns:repeat(2,1fr)">';
  subsE.forEach(sb=>{ html+='<div class="subcard'+(sb.n?' click':'')+'"'+(sb.n?' onclick="go(\'#/layer/体验/'+encodeURIComponent(sk)+'\')"':'')+'><div class="nm"><i style="background:'+sb.c+'"></i>'+sb.k+'</div><div class="n num">'+fmt(sb.n)+'</div></div>' });
  html += '</div></div></div></div>';

  /* 活动明细 */
  html += '<div class="sec"><div class="sec-h"><h3>活动明细</h3><span class="hint">门诊活动=义诊/家医联动，另有社区活动、企业活动</span></div>';
  if(acts.length===0){
    html += '<div class="empty"><div class="t">暂无活动记录</div>该社康尚未录入活动。</div>';
  } else {
    html += '<div class="panel" style="padding:0"><div class="tblwrap"><table class="tbl"><thead><tr><th>活动名称</th><th>类型</th><th>状态</th><th>活动日期</th><th class="numc">目标参与</th><th class="numc">实际参与</th><th class="numc">成本</th><th>地点</th></tr></thead><tbody>';
    acts.forEach(a=>{
      const tchip = a[2]==='义诊'||a[2]==='家医联动'?'<span class="chip b">门诊</span>':a[2]==='社区活动'?'<span class="chip o">社区</span>':'<span class="chip">企业</span>';
      const schip = a[3]==='已完成'?'<span class="chip done">已完成</span>':a[3]==='进行中'?'<span class="chip run">进行中</span>':'<span class="chip plan">计划中</span>';
      html+='<tr><td>'+esc(a[1])+'</td><td>'+tchip+' '+esc(a[2])+'</td><td>'+schip+'</td><td>'+esc(a[4]||'—')+'</td><td class="numc">'+fmt(a[5])+'</td><td class="numc">'+fmt(a[6])+'</td><td class="numc">¥'+fmt(a[7])+'</td><td>'+esc(a[8]||'—')+'</td></tr>';
    });
    html += '</tbody></table></div></div>';
  }
  html += '</div>';

  $('#app').innerHTML = html;
}

/* ============ 图表 ============ */
function grd(c1,c2){return new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:c1},{offset:1,color:c2}]);}
function makeChart(id, option){
  const el = document.getElementById(id);
  if(!el || !window.echarts) return;
  const ch = echarts.init(el);
  ch.setOption(option);
  new ResizeObserver(()=>ch.resize()).observe(el);
  return ch;
}
function baseTooltip(){ return {confine:true} }

/* 近30日趋势（总览） */
function drawFunnel(){
  const data = STAGE.map((st)=>{
    const ps=periodStats(st);
    const nosup = curAge!=='全部' && !ageSupported(st);
    return {name:st, value:ps.total, nosup};
  });
  makeChart('cFunnel', {
    tooltip:{confine:true, formatter:p=>{
      const d=p.data;
      return d.name+'用户：'+fmt(d.value)+' 人'+(d.nosup?'（未采集年龄，全量）':'');
    }},
    series:[{
      type:'funnel', left:'5%', right:'5%', top:12, bottom:12, width:'62%',
      minSize:'22%', maxSize:'98%', sort:'none', gap:2,
      label:{show:true,position:'inside',formatter:p=>p.name+'用户\n'+fmt(p.value)+(p.data.nosup?'*':'')},
      itemStyle:{borderColor:'rgba(255,255,255,.85)',borderWidth:2,shadowColor:'rgba(15,107,87,.18)',shadowBlur:14},
      data:data.map(d=>({name:d.name,value:d.value,itemStyle:{color: d.nosup?'#D3D5CD':new echarts.graphic.LinearGradient(0,0,0,1,FUNNEL_GRAD[d.name])}}))
    }]
  });
}
function drawTrend(){
  const regRows=layerRows('触达'), expRows=layerRows('体验');
  const days=[], touch=[], exp=[];
  for(let i=29;i>=0;i--){
    const d=new Date(REF); d.setDate(d.getDate()-i);
    const k = fmtLocal(d);
    days.push(k.slice(5));
    touch.push(regRows.filter(r=>r[1]===k).length);
    exp.push(expRows.filter(r=>r[5]===k).length);
  }
  makeChart('cTrend', {
    color:['#7FB8A8','#2F8A73'],
    tooltip:{trigger:'axis',confine:true,valueFormatter:v=>v+' 人'},
    legend:{data:['触达新增','体验新增'],bottom:0,icon:'circle',itemWidth:8,itemHeight:8},
    grid:{left:8,right:16,top:18,bottom:44,containLabel:true},
    xAxis:{type:'category',data:days,axisLine:{lineStyle:{color:'#D6D8D0'}},axisLabel:{color:'#98A29C',fontSize:11,interval:4},axisTick:{show:false}},
    yAxis:{type:'value',splitLine:{lineStyle:{color:'#EFEDE6'}},axisLabel:{color:'#98A29C',fontSize:11}},
    series:[
      {name:'触达新增',type:'bar',data:touch,barWidth:'46%',itemStyle:{color:grd('#9FD0C0','#3D9A86'),borderRadius:[4,4,0,0],shadowColor:'rgba(61,154,134,.22)',shadowBlur:8,shadowOffsetY:2}},
      {name:'体验新增',type:'line',data:exp,smooth:true,symbol:'circle',symbolSize:5,lineStyle:{width:2.5,color:'#2F8A73',shadowColor:'rgba(47,138,115,.45)',shadowBlur:8},itemStyle:{color:'#2F8A73',borderColor:'#fff',borderWidth:1.5},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(47,138,115,.18)'},{offset:1,color:'rgba(47,138,115,0)'}])}}
    ]
  });
}
/* 本月触达完成率 by 社康 */
function drawGoalBar(){
  const sk=SK.map(x=>x.replace('社康',''));
  const data=SK.map(x=>{const g=monthGoal(x,'触达');return {name:x.replace('社康',''),value:pct(g.actual,g.target)}});
  const ov=monthGoal('总体','触达');
  data.push({name:'总体',value:pct(ov.actual,ov.target)});
  makeChart('cGoal', {
    tooltip:{trigger:'axis',confine:true,valueFormatter:v=>v+'%'},
    grid:{left:8,right:24,top:12,bottom:8,containLabel:true},
    xAxis:{type:'value',max:100,splitLine:{lineStyle:{color:'#EFEDE6'}},axisLabel:{formatter:'{value}%',color:'#98A29C',fontSize:11}},
    yAxis:{type:'category',data:data.map(d=>d.name),axisLine:{show:false},axisTick:{show:false},axisLabel:{color:'#5C6B64',fontSize:12}},
    series:[{
      type:'bar',data:data.map(d=>({value:d.value,itemStyle:{color: d.value>=100?grd('#7BD0A8','#2E8B57'):(d.value>=80?grd('#EDBE6C','#C9892B'):grd('#6DB8A6','#3D9A86')),borderRadius:[0,4,4,0],shadowColor:'rgba(15,107,87,.16)',shadowBlur:6}})),
      barWidth:16,label:{show:true,position:'right',formatter:p=>p.value+'%',color:'#5C6B64',fontSize:11}
    }]
  });
}
/* 层级 30日趋势 */
function drawLayerTrend(layer, sk){
  const rows=layerRows(layer,sk);
  const days=[], vals=[];
  for(let i=29;i>=0;i--){
    const d=new Date(REF); d.setDate(d.getDate()-i);
    const k = fmtLocal(d);
    days.push(k.slice(5));
    vals.push(rows.filter(r=>timeField(layer,r)===k).length);
  }
  const c=STAGE_COLOR[layer]||'#3D9A86';
  makeChart('cLayerTrend', {
    tooltip:{trigger:'axis',confine:true,valueFormatter:v=>v+' 人'},
    grid:{left:8,right:16,top:16,bottom:8,containLabel:true},
    xAxis:{type:'category',data:days,axisLine:{lineStyle:{color:'#D6D8D0'}},axisLabel:{color:'#98A29C',fontSize:11,interval:4},axisTick:{show:false}},
    yAxis:{type:'value',splitLine:{lineStyle:{color:'#EFEDE6'}},axisLabel:{color:'#98A29C',fontSize:11}},
    series:[{type:'bar',data:vals,itemStyle:{color:grd(GRAD_TOP[layer]||'#6DB8A6',GRAD_BOT[layer]||'#2F8A73'),borderRadius:[4,4,0,0],shadowColor:'rgba(47,138,115,.18)',shadowBlur:8},barWidth:'55%'}]
  });
}

/* ============ 启动 ============ */
$('#metaDate').textContent = M.refDateCN;
$('#metaTarget').textContent = M.targetThru || '—';
document.addEventListener('click', function(e){
  const a = e.target.closest ? e.target.closest('#nav a[href^="#/"]') : null;
  if(a){ e.preventDefault(); curSrc='全部'; go(a.getAttribute('href')); return; }
  const t = e.target.closest ? e.target.closest('[data-age],[data-cat],[data-range]') : null;
  if(t){
    if(t.hasAttribute('data-age')) curAge = t.getAttribute('data-age');
    if(t.hasAttribute('data-cat')) curCat = t.getAttribute('data-cat');
    if(t.hasAttribute('data-range')){
      const rm = t.getAttribute('data-range');
      curRangeMode = rm;
      if(rm!=='custom'){ curRangeStart=''; curRangeEnd=''; }
    }
    route();
  }
});
window.addEventListener('hashchange', route);
loadSettings();
route();
function ageSyncStale(){
  if(!S.token) return false;
  if(Object.keys(S.ageSync).length===0) return true;
  if(!S.ageSyncAt) return true;
  return S.ageSyncAt.slice(0,10) < M.refDate;
}
if(ageSyncStale()) doSyncAges();
